[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omgm-backend"
version = "0.1.0"
description = "FastAPI backend for 나만 결혼해?"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
omgm-backend = "app.main:run"

[tool.setuptools.packages.find]
where = ["src"]
