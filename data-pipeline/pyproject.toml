[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omgm-policy-pipeline"
version = "0.1.0"
description = "Policy data pipeline for 나만 결혼해?"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
policy-pipeline = "policy_pipeline.main:main"

[tool.setuptools.packages.find]
where = ["src"]
